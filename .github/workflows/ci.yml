name: Continuous Integration

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Test selector for 'setup.py test -s' (empty = full suite)"
        required: false
        default: ""

env:
  PIP_INDEX_URL: https://:2022-11-16T09:29:21.389453Z@time-machines-pypi.sealsecurity.io/

jobs:
  build:
    timeout-minutes: 45

    strategy:
      # Allows for matrix sub-jobs to fail without canceling the rest
      fail-fast: false

      matrix:
        os: [windows-latest, ubuntu-latest, macos-15-intel]
        python-version: ["2.7", "3.11", "3.10", "3.9", "3.8", "3.7", "3.6", "pypy-2.7", "pypy-3.7", "pypy-3.8"]
        lua-version: ["bundle", "lua5.3", "lua5.2", "luajit-5.1"]

        exclude:
          - os: windows-latest
            python-version: 2.7
          - os: windows-latest
            python-version: pypy-2.7
          - os: windows-latest
            lua-version: lua5.2
          - os: windows-latest
            lua-version: lua5.3
          - os: windows-latest
            lua-version: luajit-5.1
          - os: macos-10.15
            python-version: 2.7
          - os: macos-10.15
            lua-version: lua5.2
          - os: macos-10.15
            lua-version: lua5.3
          - os: macos-10.15
            lua-version: luajit-5.1

    runs-on: ${{ matrix.os }}

    env:
      CFLAGS_LTO: ${{ contains(matrix.lua-version, 'bundle')  && (contains(matrix.os, 'windows') && '/LTCG' || '-flto') || '' }}

    steps:
    - uses: actions/checkout@v3

    - name: Check out recursively
      run: git submodule update --init --recursive

    - name: Set up Python ${{ matrix.python-version }}
      if: ${{ contains(matrix.python-version, 'pypy') }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    # CPython versions actions/setup-python no longer provisions on these runners
    # (2.7, 3.6 on ubuntu-24.04) are built from source by this drop-in wrapper.
    - name: Set up Python ${{ matrix.python-version }} (CPython)
      if: ${{ !contains(matrix.python-version, 'pypy') && !(matrix.python-version == '2.7' && startsWith(matrix.os, 'macos')) }}
      uses: MatteoH2O1999/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        allow-build: allow

    # CPython 2.7 is no longer provisioned by actions/setup-python; on macOS use
    # the python.org 2.7.18 (x86_64) installer.
    - name: Set up Python 2.7 (python.org installer)
      if: ${{ matrix.python-version == '2.7' && startsWith(matrix.os, 'macos') }}
      run: |
        curl -sSLo /tmp/python-2.7.18.pkg https://www.python.org/ftp/python/2.7.18/python-2.7.18-macosx10.9.pkg
        sudo installer -pkg /tmp/python-2.7.18.pkg -target /
        echo "/Library/Frameworks/Python.framework/Versions/2.7/bin" >> "$GITHUB_PATH"

    - name: Set up Python packages
      run: python -m pip install -U "pip<21" "setuptools<45" wheel && python -m pip install -U tox virtualenv

    - name: Set up Lua ${{ matrix.lua-version }}
      if: ${{ contains(matrix.os, 'ubuntu') && !contains(matrix.lua-version, 'bundle') }}
      run: sudo apt-get update && sudo apt-get install lib${{ matrix.lua-version }}-dev

    - name: Build wheel
      run: python -m pip install -r requirements.txt && python setup.py sdist bdist_wheel
      env:
        SETUP_OPTIONS: ${{ !contains(matrix.lua-version, 'luajit') && (contains(matrix.lua-version, 'bundle') && '--use-bundle' || '--no-luajit') || '' }}
        CFLAGS: ${{ env.CFLAGS_LTO }} -g
        LDFLAGS: ${{ env.CFLAGS_LTO }}

    - name: Run tests
      run: python setup.py test ${{ inputs.test-filter && format('-s {0}', inputs.test-filter) || '' }}
      env:
        SETUP_OPTIONS: ${{ !contains(matrix.lua-version, 'luajit') && (contains(matrix.lua-version, 'bundle') && '--use-bundle' || '--no-luajit') || '' }}
        CFLAGS: ${{ env.CFLAGS_LTO }} -g
        LDFLAGS: ${{ env.CFLAGS_LTO }}

